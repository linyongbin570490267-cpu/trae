<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { padding: 24px 32px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .input-section { padding: 20px 32px; border-bottom: 1px solid #eee; }
        .input-wrapper { display: flex; gap: 12px; flex-wrap: wrap; }
        #task-input { flex: 2; min-width: 200px; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; outline: none; }
        #task-input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        #deadline-input { padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; outline: none; min-width: 150px; }
        #add-btn { padding: 14px 28px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        #add-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .task-list { padding: 16px 0; max-height: 500px; overflow-y: auto; }
        .task-item { display: flex; align-items: center; padding: 16px 32px; border-bottom: 1px solid #f5f5f5; }
        .task-item:hover { background-color: #fafafa; }
        .task-checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ddd; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0; }
        .task-checkbox:hover { border-color: #667eea; }
        .task-checkbox.checked { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-color: transparent; }
        .task-checkbox.checked::after { content: '\u2713'; color: white; font-size: 14px; font-weight: bold; }
        .task-text { flex: 1; font-size: 16px; color: #333; }
        .task-text.completed { text-decoration: line-through; color: #999; }
        .task-deadline { font-size: 12px; color: #888; margin-top: 4px; }
        .task-deadline.overdue { color: #ff4757; font-weight: 600; }
        .task-item.overdue { background-color: #fff5f5; border-left: 4px solid #ff4757; }
        .delete-btn { padding: 8px 16px; background: #fff0f0; color: #ff4757; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; opacity: 0; visibility: hidden; }
        .task-item:hover .delete-btn { opacity: 1; visibility: visible; }
        .delete-btn:hover { background: #ff4757; color: white; }
        .empty-state { padding: 60px 32px; text-align: center; color: #999; }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state p { font-size: 16px; }
        .stats { padding: 16px 32px; background: #fafafa; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>待办事项</h1>
            <p>记录你的每一天</p>
        </div>
        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="task-input" placeholder="添加新任务..." autocomplete="off">
                <input type="datetime-local" id="deadline-input">
                <button id="add-btn">添加</button>
            </div>
        </div>
        <div class="task-list" id="task-list">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                </svg>
                <p>暂无任务，快添加一个吧！</p>
            </div>
        </div>
        <div class="stats">
            <span>总计: <span id="total-count">0</span></span>
            <span>已完成: <span id="completed-count">0</span></span>
        </div>
    </div>
    <script>
        const taskInput = document.getElementById('task-input');
        const deadlineInput = document.getElementById('deadline-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const totalCount = document.getElementById('total-count');
        const completedCount = document.getElementById('completed-count');
        let tasks = [];
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        }
        function showNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: body });
            }
        }
        function checkOverdueTasks() {
            const now = new Date().getTime();
            let hasOverdue = false;
            tasks.forEach(task => {
                if (!task.completed && task.deadline) {
                    const deadlineTime = new Date(task.deadline).getTime();
                    if (deadlineTime < now) {
                        hasOverdue = true;
                        if (!task.notified) {
                            showNotification('\u23f0 待办提醒', '任务 "' + task.text + '" 已经过期了！');
                            task.notified = true;
                        }
                    }
                }
            });
            if (hasOverdue) { saveTasks(); renderTasks(); }
        }
        function isOverdue(task) {
            if (!task.completed && task.deadline) {
                return new Date(task.deadline).getTime() < new Date().getTime();
            }
            return false;
        }
        function formatDeadline(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const diff = date.getTime() - new Date().getTime();
            if (diff < 0) {
                const hours = Math.floor(Math.abs(diff) / 3600000);
                if (hours < 1) return '刚刚过期';
                if (hours < 24) return hours + '小时前过期';
                return Math.floor(hours / 24) + '天前过期';
            }
            const hours = Math.floor(diff / 3600000);
            if (hours < 1) return Math.floor(diff / 60000) + '分钟后';
            if (hours < 24) return hours + '小时后';
            return Math.floor(hours / 24) + '天后';
        }
        function loadTasks() {
            const saved = localStorage.getItem('todo-tasks');
            if (saved) { tasks = JSON.parse(saved); }
            renderTasks();
            checkOverdueTasks();
        }
        function saveTasks() {
            localStorage.setItem('todo-tasks', JSON.stringify(tasks));
            updateStats();
        }
        function updateStats() {
            totalCount.textContent = tasks.length;
            completedCount.textContent = tasks.filter(t => t.completed).length;
        }
        function renderTasks() {
            taskList.innerHTML = '';
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg><p>暂无任务，快添加一个吧！</p></div>';
                updateStats(); return;
            }
            tasks.forEach((task, index) => {
                const overdue = isOverdue(task);
                const item = document.createElement('div');
                item.className = 'task-item' + (overdue ? ' overdue' : '');
                const cb = document.createElement('div');
                cb.className = 'task-checkbox' + (task.completed ? ' checked' : '');
                cb.addEventListener('click', () => toggleTask(index));
                const content = document.createElement('div');
                content.style.flex = '1';
                const text = document.createElement('span');
                text.className = 'task-text' + (task.completed ? ' completed' : '');
                text.textContent = task.text;
                const dl = document.createElement('span');
                if (task.deadline) {
                    dl.className = 'task-deadline' + (overdue ? ' overdue' : '');
                    dl.textContent = formatDeadline(task.deadline);
                }
                content.appendChild(text);
                if (task.deadline) content.appendChild(dl);
                const del = document.createElement('button');
                del.className = 'delete-btn';
                del.textContent = '删除';
                del.addEventListener('click', () => deleteTask(index));
                item.appendChild(cb); item.appendChild(content); item.appendChild(del);
                taskList.appendChild(item);
            });
            updateStats();
        }
        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;
            tasks.push({ text, completed: false, deadline: deadlineInput.value, notified: false });
            taskInput.value = ''; deadlineInput.value = '';
            saveTasks(); renderTasks();
        }
        function toggleTask(index) { tasks[index].completed = !tasks[index].completed; saveTasks(); renderTasks(); }
        function deleteTask(index) { tasks.splice(index, 1); saveTasks(); renderTasks(); }
        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
        setInterval(checkOverdueTasks, 60000);
        requestNotificationPermission();
        loadTasks();
    </script>
</body>
</html>
